name: arovolife

# =============================================================================
# arovolife — Service Access Reference
# =============================================================================
# Web app             http://localhost:8084
# Adminer             http://localhost:8083    (server: db, user: arovolife, pass: secret)
# Mailpit UI          http://localhost:8027    (SMTP from host: localhost:1027)
#
# MySQL  (host: localhost:3307 from host, db:3306 from containers)
#   arovolife / secret      (app DB user)
#   root      / rootsecret  (DB admin)
#
# Redis  (host: localhost:6379 from host, redis:6379 from containers)
#
# NOTE: a `summary` service prints the same info on `docker compose up`.
#       For detached startup (`up -d`), view it via `docker compose logs summary`.
# =============================================================================

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: arovolife-app
    working_dir: /var/www/html
    volumes:
      - ../app:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-arovolife.ini:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: arovolife
      DB_USERNAME: arovolife
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [arovolife]

  web:
    image: nginx:1.27-alpine
    container_name: arovolife-web
    ports: ["8084:80"]
    volumes:
      - ../app:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [arovolife]

  db:
    image: mysql:8.0
    container_name: arovolife-db
    command: ["--default-authentication-plugin=caching_sha2_password"]
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: arovolife
      MYSQL_USER: arovolife
      MYSQL_PASSWORD: secret
      TZ: Asia/Kolkata
    ports: ["3307:3306"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/arovolife.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uarovolife", "-psecret"]
      interval: 5s
      retries: 30
      start_period: 10s
    networks: [arovolife]

  redis:
    image: redis:7-alpine
    container_name: arovolife-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks: [arovolife]

  mailpit:
    image: axllent/mailpit:latest
    container_name: arovolife-mailpit
    # Host ports remapped to avoid clash with docker-multi-projects mailhog (1025/8025)
    # and karonix-codex mailpit (1026/8026). Container-internal ports unchanged, so
    # the app still uses MAIL_HOST=mailpit, MAIL_PORT=1025 over the docker network.
    ports:
      - "1027:1025"   # SMTP — host 1027 → container 1025
      - "8027:8025"   # UI   — http://localhost:8027
    networks: [arovolife]

  adminer:
    image: adminer:4.8.1-standalone
    container_name: arovolife-adminer
    ports: ["8083:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on: [db]
    networks: [arovolife]

  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: arovolife-queue
    # A `queue:restart` signal makes the worker exit cleanly; this brings it
    # straight back on the new code instead of leaving the queue undrained.
    restart: unless-stopped
    working_dir: /var/www/html
    # Distributor-facing work only. `otp` is listed first so a verification
    # code always drains ahead of bulk notification traffic. Mirrors the two
    # Supervisor entries on Cloudways — see the runbook §1.9.
    command: ["php", "artisan", "queue:work", "--queue=otp,default", "--tries=3", "--sleep=2", "--timeout=120"]
    volumes:
      - ../app:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: arovolife
      DB_USERNAME: arovolife
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [arovolife]

  queue-compensation:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: arovolife-queue-compensation
    # A `queue:restart` signal makes the worker exit cleanly; this brings it
    # straight back on the new code instead of leaving the queue undrained.
    restart: unless-stopped
    working_dir: /var/www/html
    # One process, deliberately. Serialising the ledger writes means a
    # released job can never be re-reserved by a second worker while the
    # first is still running, and engine chains cannot interleave.
    command: ["php", "artisan", "queue:work", "--queue=compensation", "--tries=1", "--sleep=2", "--timeout=7200"]
    volumes:
      - ../app:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: arovolife
      DB_USERNAME: arovolife
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [arovolife]

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: arovolife-scheduler
    working_dir: /var/www/html
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ../app:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: arovolife
      DB_USERNAME: arovolife
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks: [arovolife]

  # ---------------------------------------------------------------------------
  # E2E stack — off by default; `make e2e-up` (profile `e2e`). Playwright runs
  # against http://localhost:8085 and database arovolife_e2e only. e2e-app sits
  # on an internal network (no internet); `make e2e-up` attaches the running
  # db / redis / mailpit to it with `docker network connect`, so those stateful
  # containers are never recreated. See docs/testing/e2e-plan.md.
  # ---------------------------------------------------------------------------
  e2e-app:
    image: arovolife-app:latest
    container_name: arovolife-e2e-app
    profiles: [e2e]
    working_dir: /var/www/html
    command: ["sh", "-c", "mkdir -p /tmp/e2e && exec php-fpm"]
    volumes:
      - ../app:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-arovolife.ini:ro
    environment:
      ARV_E2E: "1"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8085
      # Own framework caches, outside the shared bootstrap/cache.
      APP_CONFIG_CACHE: /tmp/e2e/config.php
      APP_ROUTES_CACHE: /tmp/e2e/routes.php
      APP_EVENTS_CACHE: /tmp/e2e/events.php
      APP_SERVICES_CACHE: /tmp/e2e/services.php
      APP_PACKAGES_CACHE: /tmp/e2e/packages.php
      DB_CONNECTION: mysql
      DB_URL: ""
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: arovolife_e2e
      # Own user: ALL on arovolife_e2e + arovolife_e2e_base only, so even
      # schema-qualified SQL cannot reach the dev database.
      DB_USERNAME: arovolife_e2e
      DB_PASSWORD: e2esecret
      # Own Redis databases: sessions in 5, cache (and rate limiters) in 6.
      REDIS_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: "5"
      REDIS_CACHE_DB: "6"
      REDIS_PREFIX: arovolife-e2e-
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      SESSION_COOKIE: arovolife_e2e_session
      SESSION_SECURE_COOKIE: "false"
      SESSION_EXPIRE_ON_CLOSE: "true"
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: ""
      # Non-empty so the boot-time S3 check passes; unroutable, and every disk
      # is remapped to storage/framework/e2e/disks by E2eServiceProvider anyway.
      AWS_ACCESS_KEY_ID: e2e-invalid
      AWS_SECRET_ACCESS_KEY: e2e-invalid
      AWS_DEFAULT_REGION: ap-south-1
      AWS_BUCKET: e2e-none
      AWS_ENDPOINT: http://127.0.0.1:1
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      RAZORPAY_WEBHOOK_SECRET: ""
      RAZORPAYX_KEY_ID: ""
      RAZORPAYX_KEY_SECRET: ""
      SHIPROCKET_EMAIL: ""
      SHIPROCKET_PASSWORD: ""
      SMS_API_KEY: ""
      KYC_PAN_API_KEY: ""
      KYC_AADHAAR_API_KEY: ""
      KYC_AADHAAR_LICENCE_KEY: ""
      KYC_BANK_PENNYDROP_KEY: ""
      WHATSAPP_API_KEY: ""
      PULSE_ENABLED: "false"
      PASSWORD_HIBP_CHECK: "false"
      COMP_RECOMPUTE_ENABLED: "true"
      COMP_RECOMPUTE_ALLOWED_DATABASES: arovolife_e2e
    networks: [arovolife-e2e]

  e2e-web:
    image: nginx:1.27-alpine
    container_name: arovolife-e2e-web
    profiles: [e2e]
    ports: ["8085:80"]
    volumes:
      - ../app:/var/www/html:ro
      - ./nginx/nginx.e2e.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [e2e-app]
    # The internal network reaches e2e-app; the default one publishes :8085.
    networks: [arovolife-e2e, arovolife]

  # ---------------------------------------------------------------------------
  # Summary — runs once on `docker compose up`, prints access info, then exits.
  # ---------------------------------------------------------------------------
  summary:
    image: busybox:1.36
    container_name: arovolife-summary
    restart: "no"
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      adminer:
        condition: service_started
      mailpit:
        condition: service_started
    command:
      - sh
      - -c
      - |
        echo ""
        echo "==============================================="
        echo "🚀  arovolife — running"
        echo "==============================================="
        echo ""
        echo "🌐  Web app             http://localhost:8084"
        echo "🛠️  Adminer             http://localhost:8083"
        echo "                        server: db   user: arovolife   pass: secret"
        echo "📧  Mailpit UI          http://localhost:8027"
        echo "                        SMTP from host: localhost:1027"
        echo ""
        echo "🗄️  MySQL  (host: localhost:3307, container: db:3306)"
        echo "    arovolife / secret      (app)"
        echo "    root      / rootsecret  (admin)"
        echo ""
        echo "📦  Redis  (host: localhost:6379, container: redis:6379)"
        echo ""
    networks: [arovolife]

networks:
  arovolife:
    name: arovolife
  arovolife-e2e:
    name: arovolife-e2e
    internal: true

volumes:
  dbdata:
    name: arovolife_dbdata
