name: arovolife-rsp

# =============================================================================
# arovolife-rsp — an isolated second stack for the autonomous R.S.P. runner
# =============================================================================
# Serves the git worktree at ../ (branch feat/compensation-rsp-updates-2026-10)
# with its OWN database volume, so the branch's migrations (which drop columns
# that main still reads) never touch the day-to-day dev stack on :8084.
#
# Web app   http://localhost:8094
# Mailpit   http://localhost:8037   (SMTP from host: localhost:1037)
# MySQL     host localhost:3317 → container db:3306   arovolife / secret, root / rootsecret
# Redis     host localhost:6389 → container redis:6379
#
# No scheduler, adminer or summary service: the runner drives engines by hand.
#
#   docker compose -f docker/docker-compose.rsp.yml up -d
#   docker exec arovolife-rsp-app php artisan migrate
# =============================================================================

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: arovolife-rsp-app
    container_name: arovolife-rsp-app
    working_dir: /var/www/html
    volumes:
      - ../app:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-arovolife.ini:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8094
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: arovolife
      DB_USERNAME: arovolife
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [arovolife-rsp]

  web:
    image: nginx:1.27-alpine
    container_name: arovolife-rsp-web
    ports: ["8094:80"]
    volumes:
      - ../app:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [arovolife-rsp]

  db:
    image: mysql:8.0
    container_name: arovolife-rsp-db
    command: ["--default-authentication-plugin=caching_sha2_password"]
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: arovolife
      MYSQL_USER: arovolife
      MYSQL_PASSWORD: secret
      TZ: Asia/Kolkata
    ports: ["3317:3306"]
    volumes:
      - rspdbdata:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/arovolife.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uarovolife", "-psecret"]
      interval: 5s
      retries: 30
      start_period: 10s
    networks: [arovolife-rsp]

  redis:
    image: redis:7-alpine
    container_name: arovolife-rsp-redis
    ports: ["6389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks: [arovolife-rsp]

  mailpit:
    image: axllent/mailpit:latest
    container_name: arovolife-rsp-mailpit
    ports:
      - "1037:1025"
      - "8037:8025"
    networks: [arovolife-rsp]

  queue:
    image: arovolife-rsp-app
    container_name: arovolife-rsp-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--queue=otp,default", "--tries=3", "--sleep=2", "--timeout=120"]
    volumes:
      - ../app:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: arovolife
      DB_USERNAME: arovolife
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [arovolife-rsp]

  queue-compensation:
    image: arovolife-rsp-app
    container_name: arovolife-rsp-queue-compensation
    restart: unless-stopped
    working_dir: /var/www/html
    # One process, tries 1 — same discipline as the real stack (ADR-0011).
    command: ["php", "artisan", "queue:work", "--queue=compensation", "--tries=1", "--sleep=2", "--timeout=7200"]
    volumes:
      - ../app:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: arovolife
      DB_USERNAME: arovolife
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [arovolife-rsp]

networks:
  arovolife-rsp:
    name: arovolife-rsp

volumes:
  rspdbdata:
    name: arovolife_rsp_dbdata
